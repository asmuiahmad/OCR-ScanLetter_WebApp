<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
    <defs>
        <!-- Gradients for depth -->
        <radialGradient id="greenGradient" cx="50%" cy="50%" r="50%">
            <stop offset="0%" style="stop-color:#3a7d5c;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#1e4d35;stop-opacity:1" />
        </radialGradient>
        <radialGradient id="goldGradient" cx="50%" cy="50%" r="50%">
            <stop offset="0%" style="stop-color:#ffd700;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#b8860b;stop-opacity:1" />
        </radialGradient>
    </defs>
    
    <!-- Outer circle (green) -->
    <circle cx="60" cy="60" r="55" fill="url(#greenGradient)" stroke="#1a3a28" stroke-width="2.5"/>
    
    <!-- Inner decorative circles -->
    <circle cx="60" cy="60" r="50" fill="none" stroke="#ffd700" stroke-width="1.5"/>
    <circle cx="60" cy="60" r="46" fill="none" stroke="#ffd700" stroke-width="0.8"/>
    
    <!-- Star emblem (Garuda style) -->
    <g transform="translate(60, 35)">
        <!-- Main star (5 points) -->
        <path d="M 0,-12 L 3,-4 L 12,-4 L 5,1 L 8,10 L 0,4 L -8,10 L -5,1 L -12,-4 L -3,-4 Z" 
              fill="url(#goldGradient)" stroke="#8b6914" stroke-width="0.8"/>
    </g>
    
    <!-- Scales of Justice (Timbangan) -->
    <g transform="translate(60, 60)">
        <!-- Center pole -->
        <rect x="-1.5" y="-10" width="3" height="28" fill="url(#goldGradient)" stroke="#8b6914" stroke-width="0.5"/>
        
        <!-- Balance beam -->
        <rect x="-22" y="-10" width="44" height="2.5" fill="url(#goldGradient)" stroke="#8b6914" stroke-width="0.5" rx="1"/>
        
        <!-- Left scale pan -->
        <g transform="translate(-18, -10)">
            <line x1="-4" y1="0" x2="0" y2="8" stroke="#ffd700" stroke-width="0.8"/>
            <line x1="4" y1="0" x2="0" y2="8" stroke="#ffd700" stroke-width="0.8"/>
            <ellipse cx="0" cy="8" rx="6" ry="2" fill="url(#goldGradient)" stroke="#8b6914" stroke-width="0.5"/>
        </g>
        
        <!-- Right scale pan -->
        <g transform="translate(18, -10)">
            <line x1="-4" y1="0" x2="0" y2="8" stroke="#ffd700" stroke-width="0.8"/>
            <line x1="4" y1="0" x2="0" y2="8" stroke="#ffd700" stroke-width="0.8"/>
            <ellipse cx="0" cy="8" rx="6" ry="2" fill="url(#goldGradient)" stroke="#8b6914" stroke-width="0.5"/>
        </g>
        
        <!-- Base -->
        <rect x="-8" y="18" width="16" height="3" fill="url(#goldGradient)" stroke="#8b6914" stroke-width="0.5" rx="1"/>
    </g>
    
    <!-- Decorative elements (Islamic pattern inspired) -->
    <g transform="translate(60, 60)" opacity="0.3">
        <circle cx="0" cy="-38" r="2" fill="#ffd700"/>
        <circle cx="0" cy="38" r="2" fill="#ffd700"/>
        <circle cx="-38" cy="0" r="2" fill="#ffd700"/>
        <circle cx="38" cy="0" r="2" fill="#ffd700"/>
    </g>
    
    <!-- Text "PENGADILAN AGAMA" in arc (top) -->
    <path id="topArcPath" d="M 20,60 A 40,40 0 0,1 100,60" fill="none"/>
    <text font-family="Arial, sans-serif" font-size="7" font-weight="bold" fill="#ffd700" letter-spacing="1">
        <textPath href="#topArcPath" startOffset="50%" text-anchor="middle">
            PENGADILAN AGAMA
        </textPath>
    </text>
    
    <!-- Text "BANJARBARU" (bottom) -->
    <text x="60" y="100" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffd700" font-family="Arial, sans-serif" letter-spacing="1.5">BANJARBARU</text>
</svg>
