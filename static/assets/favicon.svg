<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Professional favicon for Surat Masuk & Keluar OCR -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="50" cy="50" r="45" fill="url(#grad1)"/>
  
  <!-- Document envelope -->
  <rect x="30" y="30" width="40" height="35" fill="white" rx="4"/>
  <polygon points="30,30 70,30 50,40" fill="white"/>
  
  <!-- Text lines in document -->
  <rect x="35" y="40" width="30" height="2" fill="#3b82f6" rx="1"/>
  <rect x="35" y="45" width="25" height="2" fill="#3b82f6" rx="1"/>
  <rect x="35" y="50" width="20" height="2" fill="#3b82f6" rx="1"/>
  
  <!-- OCR scanning eye -->
  <circle cx="65" cy="40" r="6" fill="#10b981"/>
  <circle cx="65" cy="40" r="2.5" fill="white"/>
  
  <!-- Incoming arrow (left) -->
  <path d="M30,70 L40,70 L40,65 L50,70 L40,75 L40,70 Z" fill="white"/>
  
  <!-- Outgoing arrow (right) -->
  <path d="M70,70 L60,70 L60,65 L50,70 L60,75 L60,70 Z" fill="white"/>
  
  <!-- App name abbreviation -->
  <text x="50" y="90" text-anchor="middle" fill="white" font-size="8" font-weight="600" font-family="'Inter', sans-serif">SURAT OCR</text>
</svg>