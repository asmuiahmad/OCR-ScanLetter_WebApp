<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}{% endblock %}</title>

    <!-- Favicon and PWA manifest -->
    <link rel="icon" href="{{ url_for('static', filename='assets/favicon.svg') }}" type="image/svg+xml" sizes="any">
    <link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/svg+xml" sizes="any">
    <link rel="icon" href="{{ url_for('static', filename='favicon-simple.svg') }}" type="image/svg+xml" sizes="16x16 32x32">
    <link rel="shortcut icon" href="{{ url_for('static', filename='assets/favicon.svg') }}" type="image/svg+xml">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='assets/favicon.svg') }}">
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
    
    <!-- Theme and PWA settings -->
    <meta name="theme-color" content="#3b82f6">
    <meta name="msapplication-TileColor" content="#3b82f6">
    <meta name="application-name" content="Surat Masuk & Keluar OCR">
    <meta name="apple-mobile-web-app-title" content="Surat OCR">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <!-- Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    />

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        rel="stylesheet"
    />

    <!-- Custom CSS Files -->
    <!-- Design System - Load first for CSS variables -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='assets/css/design-system.css') }}"
    />
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='assets/css/buttons.css') }}"
    />
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='assets/css/badges.css') }}"
    />
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='assets/css/cards.css') }}"
    />
    
    <!-- Unified Button System -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='assets/css/unified-buttons.css') }}"
    />
    
    <!-- Legacy CSS Files -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='assets/css/styles.css') }}"
    />
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='assets/css/modal.css') }}"
    />
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='assets/css/sidebar.css') }}"
    />
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='assets/css/user-profile.css') }}"
    />
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='assets/css/notifications.css') }}"
    />
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='assets/css/pagination.css') }}"
    />
    
    <!-- No Animations CSS - Disable all animations for better performance -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='assets/css/no-animations.css') }}"
    />
    
    <!-- Form Labels Top - All labels above inputs for better UX -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='assets/css/form-labels-top.css') }}"
    />

    <!-- Icon Fonts -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='assets/fonts/tabler-icons.min.css') }}"
    />
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='assets/fonts/feather.css') }}"
    />
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='assets/fonts/fontawesome.css') }}"
    />
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='assets/fonts/material.css') }}"
    />
    <link
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        rel="stylesheet"
    />

    <!-- Viewer.js for image viewing -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/viewerjs/1.11.3/viewer.min.css"
    />

    <!-- CSRF Token -->
    <meta name="csrf-token" content="{{ csrf_token() }}" />

    <!-- Global Print CSS — hanya tampilkan data & tabel, sembunyikan semua UI -->
    <style>
    @media print {
        /* Sembunyikan SEGALANYA dulu */
        body > * { display: none !important; }

        /* Tampilkan hanya .main-content */
        body > .main-content { display: block !important; }

        /* Di dalam main-content, sembunyikan navbar, sidebar, progress, breadcrumb */
        .main-content > nav,
        .main-content > .spa-progress,
        .main-content nav,
        .modern-sidebar,
        #spaProgress,
        .no-print,
        .sticky-search-container,
        .search-controls,
        .page-header,
        .form-card .page-header,
        .breadcrumb,
        nav ol { display: none !important; }

        /* Tampilkan area konten */
        .main-content,
        .main-content .content,
        .main-content .content > * { display: block !important; }

        /* Reset layout */
        .main-content {
            margin: 0 !important;
            padding: 0 !important;
            width: 100% !important;
            box-shadow: none !important;
        }

        .content {
            margin: 0 !important;
            padding: 0.5cm !important;
        }

        body {
            background: white !important;
            margin: 0 !important;
        }

        /* Tabel dan data terlihat bersih */
        table { width: 100% !important; border-collapse: collapse !important; }
        th, td { border: 1px solid #ccc !important; padding: 4px 6px !important; font-size: 9pt !important; }
        thead { background: #f0f0f0 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }

        /* Sembunyikan tombol aksi di tabel */
        .ubtn, button:not([type="submit"]),
        .action-buttons, .action-cell,
        .abar, .lc-panel, .lc-stats,
        .lc-hero, canvas { display: none !important; }

        @page { size: A4 portrait; margin: 1.5cm; }
    }
    </style>

    <!-- Per-page styles injected by child templates -->
    {% block styles %}{% endblock %}
</head>
