{% extends "layouts/base.html" %} {% block content %}
<style>
    .debug-console {
        background: #1e1e1e;
        color: #d4d4d4;
        font-family: "Courier New", monospace;
        padding: 20px;
        border-radius: 8px;
        margin-top: 20px;
        max-height: 400px;
        overflow-y: auto;
    }
    .debug-log {
        margin: 5px 0;
        padding: 5px;
        border-left: 3px solid #007acc;
    }
    .debug-error {
        border-left-color: #f48771;
        color: #f48771;
    }
    .debug-success {
        border-left-color: #89d185;
        color: #89d185;
    }
    .debug-info {
        border-left-color: #569cd6;
        color: #569cd6;
    }
</style>

<div class="container mx-auto py-8 px-4">
    <div class="max-w-4xl mx-auto">
        <div
            class="bg-yellow-100 border-l-4 border-yellow-500 text-yellow-700 p-4 mb-4"
        >
            <p class="font-bold">⚠️ Debug Mode</p>
            <p>
                Halaman ini untuk debugging. Data tidak akan disimpan ke
                database.
            </p>
        </div>

        <div class="form-card">
            <div class="page-header">
                <h2>
                    <i class="fas fa-bug"></i>
                    Debug Form Pegawai
                </h2>
            </div>

            <form id="debugForm" class="p-6">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <!-- Nama -->
                    <div>
                        <label class="block text-sm font-medium mb-2">
                            Nama Lengkap <span class="text-red-500">*</span>
                        </label>
                        <input
                            type="text"
                            name="nama"
                            id="nama"
                            class="w-full px-3 py-2 border rounded"
                            placeholder="John Doe"
                        />
                    </div>

                    <!-- NIP -->
                    <div>
                        <label class="block text-sm font-medium mb-2">
                            NIP <span class="text-red-500">*</span>
                        </label>
                        <input
                            type="text"
                            name="nip"
                            id="nip"
                            class="w-full px-3 py-2 border rounded"
                            placeholder="1234567890"
                        />
                    </div>

                    <!-- Tanggal Lahir -->
                    <div>
                        <label class="block text-sm font-medium mb-2">
                            Tanggal Lahir <span class="text-red-500">*</span>
                        </label>
                        <input
                            type="date"
                            name="tanggal_lahir"
                            id="tanggal_lahir"
                            class="w-full px-3 py-2 border rounded"
                        />
                    </div>

                    <!-- Jenis Kelamin -->
                    <div>
                        <label class="block text-sm font-medium mb-2">
                            Jenis Kelamin <span class="text-red-500">*</span>
                        </label>
                        <div class="flex gap-4 mt-2">
                            <label class="inline-flex items-center">
                                <input
                                    type="radio"
                                    name="jenis_kelamin"
                                    value="Laki-laki"
                                    checked
                                />
                                <span class="ml-2">Laki-laki</span>
                            </label>
                            <label class="inline-flex items-center">
                                <input
                                    type="radio"
                                    name="jenis_kelamin"
                                    value="Perempuan"
                                />
                                <span class="ml-2">Perempuan</span>
                            </label>
                        </div>
                    </div>

                    <!-- Golongan -->
                    <div>
                        <label class="block text-sm font-medium mb-2"
                            >Golongan</label
                        >
                        <input
                            type="text"
                            name="golongan"
                            class="w-full px-3 py-2 border rounded"
                            placeholder="III/a"
                        />
                    </div>

                    <!-- Jabatan -->
                    <div>
                        <label class="block text-sm font-medium mb-2"
                            >Jabatan</label
                        >
                        <input
                            type="text"
                            name="jabatan"
                            class="w-full px-3 py-2 border rounded"
                            placeholder="Staff Administrasi"
                        />
                    </div>
                </div>

                <div class="mt-6 flex gap-4">
                    <button
                        type="submit"
                        class="bg-blue-600 text-white px-6 py-2 rounded hover:bg-blue-700"
                        id="submitBtn"
                    >
                        <i class="fas fa-bug mr-2"></i>Test Submit
                    </button>
                    <button
                        type="button"
                        class="bg-gray-600 text-white px-6 py-2 rounded hover:bg-gray-700"
                        onclick="clearConsole()"
                    >
                        <i class="fas fa-trash mr-2"></i>Clear Console
                    </button>
                    <a
                        href="{{ url_for('pegawai.pegawai') }}"
                        class="bg-green-600 text-white px-6 py-2 rounded hover:bg-green-700"
                    >
                        <i class="fas fa-arrow-left mr-2"></i>Back to Normal
                        Form
                    </a>
                </div>
            </form>
        </div>

        <!-- Debug Console -->
        <div class="form-card mt-4">
            <div class="page-header">
                <h3>
                    <i class="fas fa-terminal"></i>
                    Debug Console
                </h3>
            </div>
            <div id="debugConsole" class="debug-console">
                <div class="debug-log debug-info">
                    Debug console initialized. Ready to test...
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    function log(message, type = "info") {
        const console = document.getElementById("debugConsole");
        const div = document.createElement("div");
        div.className = `debug-log debug-${type}`;
        div.innerHTML = `[${new Date().toLocaleTimeString()}] ${message}`;
        console.appendChild(div);
        console.scrollTop = console.scrollHeight;
    }

    function clearConsole() {
        document.getElementById("debugConsole").innerHTML =
            '<div class="debug-log debug-info">Console cleared.</div>';
    }

    document
        .getElementById("debugForm")
        .addEventListener("submit", async function (e) {
            e.preventDefault();

            const submitBtn = document.getElementById("submitBtn");
            submitBtn.disabled = true;
            submitBtn.innerHTML =
                '<i class="fas fa-spinner fa-spin mr-2"></i>Testing...';

            log("=== TEST STARTED ===", "info");
            log("Collecting form data...", "info");

            const formData = new FormData(this);

            // Log form data
            log("Form data collected:", "success");
            for (let [key, value] of formData.entries()) {
                log(`  ${key}: ${value}`, "info");
            }

            // Get CSRF token
            const csrfToken = document
                .querySelector('meta[name="csrf-token"]')
                ?.getAttribute("content");
            if (csrfToken) {
                log(
                    "CSRF token found: " + csrfToken.substring(0, 20) + "...",
                    "success",
                );
                formData.append("csrf_token", csrfToken);
            } else {
                log("⚠️ CSRF token NOT found!", "error");
            }

            log("Sending POST request to /pegawai/debug...", "info");

            try {
                const response = await fetch("/pegawai/debug", {
                    method: "POST",
                    body: formData,
                    headers: {
                        "X-Requested-With": "XMLHttpRequest",
                    },
                    credentials: "same-origin",
                });

                log(
                    `Response status: ${response.status} ${response.statusText}`,
                    response.ok ? "success" : "error",
                );
                log(`Response headers:`, "info");
                log(
                    `  Content-Type: ${response.headers.get("Content-Type")}`,
                    "info",
                );

                const text = await response.text();
                log(
                    `Response body (raw): ${text.substring(0, 200)}...`,
                    "info",
                );

                try {
                    const data = JSON.parse(text);
                    log("JSON parsed successfully:", "success");
                    log(
                        JSON.stringify(data, null, 2),
                        data.success ? "success" : "error",
                    );

                    if (data.debug) {
                        log("=== DEBUG INFO ===", "info");
                        log(JSON.stringify(data.debug, null, 2), "info");
                    }

                    if (data.success) {
                        log("✓✓✓ TEST PASSED ✓✓✓", "success");
                    } else {
                        log("✗✗✗ TEST FAILED ✗✗✗", "error");
                        log(`Error: ${data.message}`, "error");
                    }
                } catch (jsonError) {
                    log("⚠️ JSON parse error: " + jsonError.message, "error");
                    log("Response is not valid JSON", "error");
                }
            } catch (error) {
                log("⚠️ Network error: " + error.message, "error");
                log(error.stack, "error");
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML =
                    '<i class="fas fa-bug mr-2"></i>Test Submit';
                log("=== TEST COMPLETED ===", "info");
            }
        });

    // Auto-fill form with test data
    document.addEventListener("DOMContentLoaded", function () {
        log(
            'Page loaded. You can fill the form and click "Test Submit"',
            "info",
        );

        // Fill with example data
        document.getElementById("nama").value = "Test User Debug";
        document.getElementById("nip").value = "DEBUG" + Date.now();
        document.getElementById("tanggal_lahir").value = "1990-01-01";

        log("Form pre-filled with test data", "success");
    });
</script>
{% endblock %}
